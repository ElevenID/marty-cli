name: Native Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt
          rustup default 1.93.0
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Install browser-package dependencies
        run: npm ci
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run native behavioral suites
        run: cargo test --workspace --locked
      - name: Test release inventory and overwrite refusal controls
        run: python -m unittest discover -s scripts/tests
      - name: Exercise the native build dependency inventory
        run: python scripts/generate_release_sboms.py --host-native --rust-only --output artifacts/native-sbom-smoke
      - name: Run the browser API compatibility suite
        run: npm test

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
      - name: Build the native release binary
        run: cargo build --workspace --release --locked

  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned Rust and WebAssembly toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default 1.93.0
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: npm ci
      - name: Exercise real package and Rust inventory generation
        run: python scripts/generate_release_sboms.py --targets wasm --output artifacts/source-sbom-smoke
      - name: Lint the browser target
        run: cargo clippy --package marty-api-client --target wasm32-unknown-unknown -- -D warnings
      - name: Rebuild the Rust/WASM package
        run: npm run build:wasm
      - name: Prove public generated bindings are current
        # wasm-bindgen's web target includes compiler hashes in internal closure
        # symbols. Normalize only those hashes before comparing the complete
        # generated browser wrapper and declaration.
        shell: bash
        run: |
          python - <<'PY'
          import difflib
          import re
          import subprocess
          from pathlib import Path

          paths = (
              "packages/api-core/src/wasm/marty_api_client.js",
              "packages/api-core/src/wasm/marty_api_client.d.ts",
          )
          closure_hash = re.compile(
              r"(wasm_bindgen__convert__closures_____invoke__)h[0-9a-f]+"
          )

          failed = False
          for path in paths:
              expected = subprocess.check_output(
                  ["git", "show", f"HEAD:{path}"], text=True
              ).replace("\r\n", "\n")
              actual = Path(path).read_text(encoding="utf-8").replace("\r\n", "\n")
              expected = closure_hash.sub(r"\1hNORMALIZED", expected)
              actual = closure_hash.sub(r"\1hNORMALIZED", actual)
              if expected == actual:
                  continue
              failed = True
              print("".join(difflib.unified_diff(
                  expected.splitlines(keepends=True),
                  actual.splitlines(keepends=True),
                  fromfile=f"committed/{path}",
                  tofile=f"regenerated/{path}",
              )))

          raise SystemExit(1 if failed else 0)
          PY
      - name: Run browser API behavioral compatibility tests
        run: npm test
      - name: Verify a fresh install of the packed API client
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/api-core/package.json').version")"
          mkdir "$RUNNER_TEMP/marty-sdk-pack"
          cp LICENSE packages/api-core/LICENSE
          npm pack --workspace @elevenid/marty-api-core --pack-destination "$RUNNER_TEMP/marty-sdk-pack"
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/marty-sdk-install" \
            "$RUNNER_TEMP/marty-sdk-pack/elevenid-marty-api-core-$version.tgz"
          node scripts/check-packed-api-client.mjs "$RUNNER_TEMP/marty-sdk-install" "$version"
          node scripts/check-packed-api-types.mjs "$RUNNER_TEMP/marty-sdk-pack/elevenid-marty-api-core-$version.tgz"
