name: Native Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt
          rustup default 1.93.0
      - name: Install browser-package dependencies
        run: npm ci
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run native behavioral suites
        run: cargo test --workspace --locked
      - name: Run the browser API compatibility suite
        run: npm test

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
      - name: Build the native release binary
        run: cargo build --workspace --release --locked

  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned Rust and WebAssembly toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default 1.93.0
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: npm ci
      - name: Lint the browser target
        run: cargo clippy --package marty-api-client --target wasm32-unknown-unknown -- -D warnings
      - name: Rebuild the Rust/WASM package
        run: npm run build:wasm
      - name: Prove generated bindings are current
        run: git diff --exit-code -- packages/api-core/src/wasm
      - name: Run browser API behavioral compatibility tests
        run: npm test
