[workspace]
members = ["crates/marty-api-client", "crates/marty-cli"]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ElevenID/marty-cli"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
dirs = "6.0"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"
uuid = { version = "1.20", features = ["js", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
